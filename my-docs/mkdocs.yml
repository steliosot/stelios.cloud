site_name: DevLab

theme:
  name: material
  logo: assets/logo-stelios.png
  favicon: assets/logo-stelios.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy        # copy button on code blocks
    - navigation.top           # quick back-to-top
    - navigation.footer        # nicer prev/next footer

# ---- Assets ----
extra_css:
  - styles/header-bg.css
  - styles/extra.css            # keep last-ish so it can win
  - styles/font-size.css        # font zoom buttons
extra_javascript:
  - styles/font-size.js
  - styles/controls.js
  - styles/fab-footer-avoid.js  
  - styles/brand-animate.js  

# ---- Plugins ----
plugins:
  - search

# ---- Markdown extensions required by your pages ----
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details            # collapsible sections
  - pymdownx.superfences        # fenced code features
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg

# ---- Navigation ----
nav:
  - Home: index.md
  - Cloud Computing:
      - Welcome: cloud-computing/welcome.md
      - Unit 1:
          - Overview: cloud-computing/unit-1/index.md
          - Notes: cloud-computing/unit-1/notes.md
          - Lab:
              - Part 1: cloud-computing/unit-1/lab/part-1.md
              - Part 2: cloud-computing/unit-1/lab/part-2.md
              - Part 3: cloud-computing/unit-1/lab/part-3.md
      - Unit 2: cloud-computing/unit-2.md
      - Unit 3: cloud-computing/unit-3.md
      - Unit 4: cloud-computing/unit-4.md
      - Unit 5: cloud-computing/unit-5.md
      - Unit 6: cloud-computing/unit-6.md
      - Unit 7: cloud-computing/unit-7.md
      - Unit 8: cloud-computing/unit-8.md
      - Unit 9: cloud-computing/unit-9.md
      - Unit 10: cloud-computing/unit-10.md
  - Big Data:
      - Welcome: big-data/welcome.md
      - Unit 1: big-data/unit-1.md
      - Unit 2: big-data/unit-2.md
      - Unit 3: big-data/unit-3.md
      - Unit 4: big-data/unit-4.md
      - Unit 5: big-data/unit-5.md
      - Unit 6: big-data/unit-6.md
      - Unit 7: big-data/unit-7.md
      - Unit 8: big-data/unit-8.md
      - Unit 9: big-data/unit-9.md
      - Unit 10: big-data/unit-10.md
  - About: about.md
